[project]
name = "deal-finder"
description = "AI-assisted price-comparison tool for Italian e-commerce, with a pluggable LLM backend"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
# La versione NON è duplicata qui: unica sorgente `offerte.config.VERSION`,
# letta da [tool.setuptools.dynamic]. Prima erano tre valori indipendenti
# (pyproject, config.py, badge README) e divergevano.
dynamic = ["version"]

# Le dipendenze runtime sono gestite via requirements.txt (applicazione),
# requirements-dev.txt (solo per costruire il bundle Windows) e
# requirements-test.txt — quest'ultimo resta un file a sé perché la CI ne legge
# le versioni di ruff/mypy/pip-audit con un `grep`: è la sorgente unica, e
# spostarlo qui vorrebbe dire scriverle due volte.

[project.scripts]
deal-finder = "offerte.cli:main"

[project.urls]
Homepage = "https://github.com/DiegoRiccardi1234/deal-finder"
Changelog = "https://github.com/DiegoRiccardi1234/deal-finder/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "offerte.config.VERSION" }

# Layout flat con molti moduli top-level: l'auto-discovery di setuptools
# fallirebbe, quindi packages e py-modules sono espliciti.
[tool.setuptools]
packages = ["offerte", "offerte.scrapers", "ui"]
py-modules = [
    "app",
    "_shared",
    "offerte_tech",
    "knowledge_base",
    "price_history",
    "search_history",
    "watchlist",
    "update_sync",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data", "dist"]

[tool.ruff.lint]
# E/F = pycodestyle+pyflakes, I = isort, UP = pyupgrade, B = bugbear.
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # line-length gestita dal formatter, non bloccare a lint
    "B008",   # call-in-default comune con argparse/Streamlit
    # --- Regole "architetturali" (non bug) ---
    # Il progetto è stato splittato da due monoliti in package con re-export via
    # star-import: offerte_tech fa `from offerte import *`, e i moduli condividono
    # costanti con `from offerte._constants import *` / `from offerte.parsing import *`.
    # Inoltre app.py richiede `st.set_page_config()` come prima istruzione.
    # Queste regole confliggono con quel design e sono silenziate a livello progetto.
    "F403",   # `from x import *`
    "F405",   # nome forse proveniente da star-import
    "E402",   # import non in cima al modulo (Streamlit + costante di fallback inline)
    "I001",   # ordinamento import (blocchi spezzati da import condizionali/star)
]

[tool.ruff.lint.per-file-ignores]
# Test e probe: ridefinizioni, asserzioni e helper liberi.
"tests/*" = ["F401", "F811", "B011", "E741", "E731"]
# NB: l'eccezione "tools/*" = ["B023", "F401"] è stata rimossa insieme agli
# script one-shot del refactor che la richiedevano. Ciò che resta in tools/
# passa il lint pieno: se serve reintrodurla, è il segnale di un nuovo script
# da tenere fuori dal repo.

[tool.mypy]
# Advisory, non-strict: obiettivo segnale, non blocco della CI.
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
exclude = ['^\.venv/', '^tests/probe_', '^data/']

[tool.pytest.ini_options]
# Era `pytest.ini`: un file in meno nella radice, zero differenze di
# comportamento (pytest legge questa sezione con la stessa precedenza).
pythonpath = "."
testpaths = ["tests"]
markers = [
    "playwright: test E2E della UI (richiedono Playwright + server Streamlit su :9000)",
]
