# Si lancia da qui:  docker compose -f docker/docker-compose.yml up
#
# Il contesto di build resta la radice del progetto — è lì che stanno il codice
# e `.dockerignore`, che Docker legge solo dalla radice del contesto e non
# accanto al Dockerfile.
services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8501:8501"
    environment:
      # Provider AI attivo e chiavi (compila solo quelle che usi)
      - AI_PROVIDER=${AI_PROVIDER:-cerebras}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Accesso dashboard + eBay (opzionali)
      - APP_PASSWORD=${APP_PASSWORD:-}
      - EBAY_APP_ID=${EBAY_APP_ID:-}
      - EBAY_CERT_ID=${EBAY_CERT_ID:-}
    volumes:
      # Persiste KB, storico, preferiti, cache tra i riavvii del container.
      # `../data` e non `./data`: i percorsi relativi di compose partono dalla
      # cartella del file, che ora è `docker/`.
      - ../data:/app/data
    restart: unless-stopped
