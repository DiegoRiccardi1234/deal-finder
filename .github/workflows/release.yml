name: release

# Il bundle si costruisce su Windows perché è per Windows: PyInstaller non fa
# cross-compilazione, e l'icona nell'area di notifica è Win32.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # La stessa minore della matrice di `ci.yml`: il bundle si porta
          # dietro il proprio interprete, quindi questa è la versione che
          # useranno tutti quelli che scaricano lo zip.
          python-version: "3.11"
          cache: pip

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Costruisci il bundle
        # Lo script fallisce da solo se l'archivio esce troncato: meglio una
        # release senza allegato che una con un allegato rotto.
        run: python scripts/build_exe.py

      - name: Estrai le note dal CHANGELOG
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v',''
          $content = Get-Content CHANGELOG.md -Raw
          $escaped = [regex]::Escape($version)
          $pattern = "(?ms)^## \[$escaped\][^\r\n]*\r?\n(.*?)(?=\r?\n## \[|\z)"
          $match = [regex]::Match($content, $pattern)
          if ($match.Success) {
            $section = $match.Groups[1].Value.Trim()
          } else {
            $section = "Release $tag"
          }
          $section | Out-File -FilePath release-notes.md -Encoding utf8

      - name: Allega alla release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DealFinder-windows.zip
          body_path: release-notes.md
          # Se il bundle non c'è la release deve fallire, non uscire vuota:
          # una release senza allegato manda l'utente a scaricare il nulla.
          fail_on_unmatched_files: true

      - name: Conserva l'archivio (esecuzione a mano)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: DealFinder-windows
          path: dist/DealFinder-windows.zip
          retention-days: 14
